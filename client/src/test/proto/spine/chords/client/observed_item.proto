syntax = "proto3";

package spine.chords.client;

import "spine/options.proto";
import "spine/core/user_id.proto";

option (type_url_prefix) = "type.spine.chords";
option java_package = "io.spine.chords.client.given";
option java_multiple_files = true;

// An entity with a message ID for client observation tests.
message ObservedItem {
    option (entity).kind = PROJECTION;

    // Identifies an item across subscription updates.
    spine.core.UserId id = 1;

    // Distinguishes successive states of the same item.
    string label = 2 [(column) = true];
}

// An entity with a scalar ID for client observation tests.
message NamedItem {
    option (entity).kind = PROJECTION;

    // Identifies an item without a Protobuf message wrapper.
    string name = 1;
}

// A state whose message-based entity ID is kept outside the state.
message IdlessItem {
    option (entity).kind = PROJECTION;

    // A display value that must not be mistaken for an entity ID.
    string label = 1 [(column) = true];
}

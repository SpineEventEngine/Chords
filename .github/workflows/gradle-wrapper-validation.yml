name: Validate Gradle Wrapper
on:
  pull_request:
    branches:
      - '**'

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
